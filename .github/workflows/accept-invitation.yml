name: LibreLinkUp v4.16 - Install and Screenshot

on:
  workflow_dispatch:

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download APK/APKM files from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list
          gh release download v1.0 --pattern "*.apk" --pattern "*.apkm" --clobber
          ls -la

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator, install helper + apkm, screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          disable-animations: true
          script: |
            echo "=== קבצים שהורדו ==="
            ls -la *.apk *.apkm 2>/dev/null || true

            echo "=== מתקין את APKMirror Helper ==="
            HELPER_APK=$(ls *helper*.apk 2>/dev/null | head -n1)
            echo "Helper APK: $HELPER_APK"
            adb install -r "$HELPER_APK" || echo "helper install failed, exit $?"

            echo "=== בודק אם apkm הוא בעצם zip (bundle) ==="
            APKM_FILE=$(ls *.apkm 2>/dev/null | head -n1)
            echo "APKM file: $APKM_FILE"
            file "$APKM_FILE" || true

            echo "=== מנסה install-multiple ישירות (שיטה 1) ==="
            mkdir -p apkm_extracted
            cp "$APKM_FILE" apkm_extracted/bundle.zip
            cd apkm_extracted
            unzip -o bundle.zip
            ls -la
            cd ..

            APK_FILES=$(find apkm_extracted -name "*.apk" | tr '\n' ' ')
            echo "APK files found inside bundle: $APK_FILES"

            if [ -n "$APK_FILES" ]; then
              adb install-multiple -r $APK_FILES || echo "install-multiple failed, exit $?"
            else
              echo "לא נמצאו קבצי APK בתוך ה-bundle"
            fi

            echo "=== רשימת חבילות מותקנות (לבדיקה) ==="
            adb shell pm list packages | grep -i libre || echo "LibreLinkUp not found in package list"

            echo "=== מפעיל את האפליקציה ==="
            adb shell monkey -p org.nativescript.LibreLinkUp -c android.intent.category.LAUNCHER 1 || echo "launch failed, exit $?"
            sleep 10

            echo "=== צילום מסך ==="
            adb exec-out screencap -p > screenshot_login.png || true

            echo "=== UI dump ==="
            adb shell uiautomator dump /sdcard/window_dump.xml || true
            adb pull /sdcard/window_dump.xml ui_dump_login.xml || true

            echo "=== לוגים לאבחון ==="
            adb logcat -d *:E > logcat_errors.log || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libre-v416-install-debug
          path: |
            screenshot_login.png
            ui_dump_login.xml
            logcat_errors.log
          retention-days: 3
